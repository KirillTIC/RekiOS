[package]
name = "reki_os"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[bin]]
name = "reki_os"
test = false
bench = false

[dependencies]
linked_list_allocator = "0.10"
bootloader_api = "0.11"
spin = "0.5.2"
x86_64 = "0.15.4"
pic8259 = "0.10.1"
pc-keyboard = "0.7.0"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]
