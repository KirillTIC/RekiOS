[package]
name = "reki_os"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[bin]]
name = "reki_os"
test = false
bench = false

[dependencies]
bootloader_api = "0.11"
spin = "0.5.2"
x86_64 = "0.15.4"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

